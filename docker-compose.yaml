services:
  tusd-service:
    image: tusproject/tusd:latest
    volumes:
      - /home/ahmed-ghallab/projects/HomeCast/data/uploads:/srv/tusd-data
    networks:
      - homecast

  proxy:
    image: nginx
    volumes:
      - type: bind
        source: /home/ahmed-ghallab/projects/HomeCast/services/proxy/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        
      - type: bind
	source: /home/ahmed-ghallab/projects/HomeCast/data/media
	target: /usr/share/nginx/html/hls
	read_only: true

    ports:
      - "80:80"
    networks:
      - homecast

networks:
  homecast:
    driver: bridge
